<app-page-header [title]="product()?.name ?? 'Detalle de Estado'" description="Información completa del estado">
  <a mat-button routerLink="/products"><mat-icon>arrow_back</mat-icon> Volver</a>
  <a *appHasRole="'Admin'" mat-raised-button color="primary"
     [routerLink]="['/products', product()?.id, 'edit']">
    <mat-icon>edit</mat-icon> Editar
  </a>
</app-page-header>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
} @else if (product()) {
  <mat-card>
    <mat-card-content>

      <div class="detail-grid">
        <div class="detail-field">
          <span class="detail-field__label">Nombre</span>
          <span class="detail-field__value">{{ product()!.name }}</span>
        </div>        
        <div class="detail-field full-width">
          <span class="detail-field__label">Descripción</span>
          <span class="detail-field__value">{{ product()!.description }}</span>
        </div>
        @if (product()!.createdAt) {
          <div class="detail-field">
            <span class="detail-field__label">Creado</span>
            <span class="detail-field__value">{{ product()!.createdAt | date:'medium' }}</span>
          </div>
        }
        @if (product()!.createdBy) {
          <div class="detail-field">
            <span class="detail-field__label">Creado por</span>
            <span class="detail-field__value">{{ product()!.createdBy }}</span>
          </div>
        }
      </div>
    </mat-card-content>
  </mat-card>
}
