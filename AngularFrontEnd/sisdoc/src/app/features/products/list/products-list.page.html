<app-page-header title="Productos" description="Catálogo de productos disponibles">
  <button *appHasRole="'Admin'" mat-raised-button color="primary" routerLink="/products/new">
    <mat-icon>add</mat-icon> Nuevo producto
  </button>
</app-page-header>

<mat-card>
  <mat-card-content>

    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar producto</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input 
        matInput
        [formControl]="searchControl"
        placeholder="Nombre, categoria o descripción..."
        aria-label="Buscar producto"
        aria-live="polite"
      />
    </mat-form-field>

    @if(loading()){
    <div class="table-skeleton">
      @for(i of [1,2,3,4,5]; track i)
      {
      <div class="skeleton-row"></div>
      }
    </div>
    }
    @else if(dataSource.data.length === 0){
    <app-empty-state icon="inventory_2" title="No products found"
      message="There are no products available at the moment."></app-empty-state>
    }
    @else {
    <div class="table-container">
      <table mat-table [dataSource]="dataSource" aria-label="Listado de productos">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let p">{{ p.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let p" class="description-cell">{{ p.description }}</td>
        </ng-container>

        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Categoría</th>
          <td mat-cell *matCellDef="let p">{{ p.category }}</td>
        </ng-container>

        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef>Precio</th>
          <td mat-cell *matCellDef="let p">{{ p.price | currency:'USD':'symbol':'1.2-2' }}</td>
        </ng-container>

        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef>Stock</th>
          <td mat-cell *matCellDef="let p">
            {{ p.stock }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let p">
            <button mat-icon-button matTooltip="Ver detalle" [routerLink]="['/products', p.id]"
              aria-label="Ver detalle del producto">
              <mat-icon>visibility</mat-icon>
            </button>
            <button 
            *appHasRole="'Admin'" 
            mat-icon-button 
            matTooltip="Editar" 
            aria-label="Editar producto"
            (click)="editProduct(p.id)">
              <mat-icon>edit</mat-icon>
            </button>
            <button 
            *appHasRole="'Admin'" 
            mat-icon-button 
            color="warn" 
            matTooltip="Eliminar"
            (click)="confirmDelete(p)"  
            aria-label="Eliminar producto">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <mat-paginator [length]="totalItems" [pageSize]="pageSize" [pageIndex]="pageIndex" [pageSizeOptions]="[5, 10, 25]"
      (page)="onPageChange($event)" aria-label="Paginación de productos" />
    }
  </mat-card-content>
</mat-card>
